# Standard LoRA, attention projections only, on the FlowBP K=3 run.
_base_: sd3_5_flowbp_sparse_hpsv3plusplus_k3.yaml

train:
  output_dir: outputs/Thesis/sd3_5_flowbp_sparse_hpsv3plusplus_k3_lora_attn_r8_lr1e4

optimizer:
  # Low-rank adapters need a larger LR than the 1e-5 used by the full-finetune
  # run. Every low-rank config in this panel shares 1e-4.
  learning_rate: 1.0e-4

lora:
  enabled: true
  # `attention` = to_q/to_k/to_v/to_out + the joint-attention add_* projections,
  # i.e. the same set as `default` minus the feed-forward projections.
  target_modules: attention
  rank: 8
  alpha: 16
  dropout: 0.0

eval:
  # Denser than the K=3 base, which evaluates every 100. The adapter runs are
  # compared on their curves as well as their final score.
  evaluation_interval: 50

logging:
  run_name: sd3_5_flowbp_sparse_hpsv3plusplus_k3_lora_attn_r8_lr1e4_bs4
  tags:
    - thesis
    - hpsv3plusplus
    - sd35
    - flowbp-sparse
    - k3
    - lora
    - attention-only
    - rank-8
